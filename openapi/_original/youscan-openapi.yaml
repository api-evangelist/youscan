                    totalMentions: 100
                    savedCount: 100
                    failedCount: 0
                    status: Completed
                    createdAt: '2024-12-15T10:00:00Z'
                    startedAt: '2024-12-15T10:01:00Z'
                    completedAt: '2024-12-15T10:15:00Z'
                    lastError: null
                  - importId: 12345679
