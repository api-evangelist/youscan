                    status: Processing
                    createdAt: '2024-12-15T11:00:00Z'
                    startedAt: '2024-12-15T11:01:00Z'
                    completedAt: null
                    lastError: null

        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/TopicNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
