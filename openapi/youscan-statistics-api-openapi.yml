        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    ValidationError:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            errorCode: VALIDATION_ERROR
            message: '''TextQuery'' should not be empty.'
            errors:
            - field: TextQuery
              errorCode: notempty_error
              message: '''TextQuery'' should not be empty.'
    Unauthorized:
      description: The API key is missing or invalid.
  parameters:
    StatisticsExcludeTag:
      name: excludeTag
      in: query
      description: Exclude mentions by tag IDs. Multiple values are supported.
      schema:
        type: array
        items:
          type: integer
    StatisticsExcludeSources:
      name: excludeSources
      in: query
      description: Exclude mentions by source. Multiple values are supported.
      schema:
        type: array
        items:
          type: string
    StatisticsSources:
      name: sources
      in: query
      description: Filter mentions by source. Multiple values are supported.
      schema:
        type: array
        items:
          type: string
      example:
      - telegram.me
      - youscan.io
    StatisticsExcludeSourceTypes:
      name: excludeSourceTypes
      in: query
      description: Exclude mentions by source type. Multiple values are supported.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SourceTypeFilter'
    StatisticsExcludeCountry:
      name: excludeCountry
      in: query
      description: Exclude mentions by ISO alpha-2 country codes. Multiple values are supported.
      schema:
        type: array
        items:
          type: string
    StatisticsCountry:
      name: country
      in: query
      description: Filter mentions by ISO alpha-2 country codes. Multiple values are supported.
      schema:
        type: array
        items:
          type: string
      example:
      - us
      - ua
    StatisticsSourceTypes:
      name: sourceTypes
      in: query
      description: Filter mentions by source type. Multiple values are supported.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SourceTypeFilter'
    StatisticsFrom:
      name: from
      in: query
      description: 'ISO formatted date from (`yyyy-MM-dd`). Filters by publication date; the day starts in the API key owner''s time zone (see *Dates and time zones* in the Mentions section). Default - 6 days before today.

        '
      schema:
        type: string
        format: date
        example: '2024-01-01'
    StatisticsTo:
      name: to
      in: query
      description: 'ISO formatted date to (`yyyy-MM-dd`), inclusive. The day ends in the API key owner''s time zone (see *Dates and time zones* in the Mentions section). Default - today.

        '
      schema:
        type: string
        format: date
        example: '2024-12-31'
    StatisticsTags:
      name: tags
      in: query
      description: Filter mentions by tag IDs. Multiple values are supported.
      schema:
        type: array
        items:
          type: integer
    TopicId:
      name: topicId
      in: path
      required: true
      description: ID of the Topic.
      schema:
        type: integer
  schemas:
    ValidationError:
      type: object
      properties:
        errorCode:
          type: string
          const: VALIDATION_ERROR
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              errorCode:
                type: string
              message:
                type: string
    LinkItem:
      type: object
      properties:
        key:
          type: string
          description: The link, or the root domain for hosts.
        count:
          type: integer
          description: Number of mentions containing the link.
        totalEngagement:
          type: integer
        avgEngagement:
          type: number
          description: Average engagement per mention. Omitted when the link has no engagement.
        sentiment:
          type: object
          description: Distribution by sentiment.
          properties:
            values:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                    enum:
                    - positive
                    - neutral
                    - negative
                    - undefined
                  count:
                    type: integer
            otherCount:
              type: integer
    SourceTypeFilter:
      type: string
      enum:
      - blog
      - forum
      - news
      - social
      - reviews
      - messenger
    NameCount:
      type: object
      properties:
        name:
          type: string
          description: Name of the bucket.
        count:
          type: integer
          description: Number of mentions in the bucket.
    TermWithSentiments:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
        sentiments:
          type: array
          description: Distribution by sentiment.
          items:
            $ref: '#/components/schemas/NameCount'
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API key authentication. The recommended way to authenticate requests.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
      description: API key as a query parameter. For testing purposes only.
