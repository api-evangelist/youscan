description: >-
  YouScan serves NO /.well-known/ discovery documents. Every path was probed on all four
  hosts on 2026-08-13. api.youscan.io and youscan.io return hard 404s. developers.youscan.io
  (a Scalar single-page docs app) and app.youscan.io (the product SPA) answer HTTP 200 with
  an identical text/html application shell for EVERY /.well-known/ path — a catch-all route,
  not a document — so those 200s are recorded as soft hits and treated as misses.
  NO WellKnown or SecurityTxt pointer is emitted in apis.yml: the probe records an absence,
  and an absence must not be scored as a presence.
