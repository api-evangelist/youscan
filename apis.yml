aid: youscan
name: YouScan
description: >-
  YouScan is an AI-powered social media listening and consumer-intelligence platform
  that monitors mentions, conversations, and images across social networks, news, blogs,
  forums, and review sites. It provides sentiment analysis, trend and topic detection,
  visual insights via image recognition, and an AI Insights Copilot for querying data in
  natural language. YouScan exposes a REST API (documented with an OpenAPI 3.1
  specification) to manage monitoring topics, retrieve and stream mentions, manage tags,
  run data imports, and query statistics, plus outbound webhooks that push new mentions
  to subscriber endpoints in real time.
