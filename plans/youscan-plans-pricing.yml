description: >-
  YouScan publishes two plan tiers. Only STARTER carries a listed price; the "Unlimited"
  tier is quote-based behind a demo request. Critically for this catalog: API ACCESS IS NOT
  PART OF THE PRICED TIER. The pricing page lists "data export options and API access" only
  under the Unlimited (quote-based) plan, and the knowledge base states plainly that "API data
  access is available as a paid add-on. Please contact your Customer Success Manager or email
  us at support@youscan.io." So there is NO published price for API access at any tier.
plan_count: 2
priced_plan_count: 1
api_access:
  publicly_priced: false
  model: paid add-on, quote only
  gate: Customer Success Manager / support@youscan.io
  included_in:
  - Unlimited
  evidence: https://help.youscan.io/en/articles/2754452-how-to-use-youscan-api
  note: >-
    A developer cannot self-serve an API key. Access must be enabled on the account first;
    the key is then generated in My Settings -> API key.
