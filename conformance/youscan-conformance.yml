summary: >-
  Cross-cutting standards conformance for the YouScan API, derived from its OpenAPI 3.1
  spec and documented behavior. YouScan is a plain REST + API-key data API; it does not
  implement OAuth/OIDC or domain profiles (FHIR/FAPI/SCIM/OData/PSD2).
